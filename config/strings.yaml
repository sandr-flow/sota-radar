    welcome: "👋 Welcome to <b>sota-radar</b>!\n\nYour AI assistant for tracking latest ML research.\n\n🔹 Short bilingual summaries (EN/RU)\n🔹 Trending papers from HuggingFace\n🔹 Deep analysis on demand\n\nChoose your language to continue:"
