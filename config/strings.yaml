    help: "📚 <b>sota-radar Commands</b>\n\n<b>Browse Papers:</b>\n/digest — Trending from HuggingFace\n/latest — Latest from arXiv\n\n<b>Settings:</b>\n/language — Change language\n/start — Welcome message\n\n<b>Help:</b>\n/help — Show this message\n\n<b>Tracked Categories:</b>\n{categories}"
