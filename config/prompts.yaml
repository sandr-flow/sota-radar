prompts:
  bilingual_summary: |
    You are a scientific paper summarization assistant. Generate a concise summary of the following research paper abstract in both English and Russian.
    
    Requirements:
    - Summarize in 2-3 sentences per language
    - Focus on: main contribution, method, and key results
    - Keep each summary under {max_length} characters
    - Use plain text only, no formatting or markup
    
    Return your response as a JSON object with this exact structure:
    {{
      "en": "English summary here...",
      "ru": "Russian summary here..."
    }}
    
    Abstract:
    {text}

  rag_essence: |
    Based on the following excerpts from a research paper, answer briefly: What is the main idea and contribution of this paper?
    
    Context:
    {context}
    
    Answer in 2-3 sentences maximum. Be specific and concise.
    Return as JSON: {{"en": "English answer", "ru": "Russian answer"}}

  rag_importance: |
    Based on the following excerpts from a research paper, answer briefly: Why is this research important? What problem does it solve?
    
    Context:
    {context}
    
    Answer in 2-3 sentences maximum. Focus on significance and impact.
    Return as JSON: {{"en": "English answer", "ru": "Russian answer"}}

  rag_applications: |
    Based on the following excerpts from a research paper, answer briefly: Where can this research be applied in practice?
    
    Context:
    {context}
    
    Answer in 2-3 sentences maximum. Give concrete examples if possible.
    Return as JSON: {{"en": "English answer", "ru": "Russian answer"}}

  # Retrieval Queries
  rag_essence_query: "{title} main contribution methodology approach"
  rag_importance_query: "{title} significance impact problem solved"
  rag_applications_query: "{title} applications use cases practical"


